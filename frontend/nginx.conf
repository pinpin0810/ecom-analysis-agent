server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue路由history模式，必须这个
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 代理转发后端接口，后端服务名是 compose 里的 backend，端口8000
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
